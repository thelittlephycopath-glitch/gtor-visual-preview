name: Build GTor Visual Preview APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify UI-only boundary
        run: bash scripts/verify-preview-only.sh
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found on this runner."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --licenses < <(yes)
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one debug APK; found ${#apks[@]}."
            exit 1
          fi
          sha256sum "${apks[0]}" > app/build/outputs/apk/debug/SHA256SUMS.txt
          {
            echo "APK_FILE=$(basename "${apks[0]}")"
            echo "APK_SHA256=$(cut -d ' ' -f 1 app/build/outputs/apk/debug/SHA256SUMS.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK built and checksum generated."
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: gtor-visual-preview-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
